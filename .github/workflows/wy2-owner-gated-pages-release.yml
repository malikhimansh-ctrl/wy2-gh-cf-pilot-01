name: WY2 Owner-gated Cloudflare Pages release
on:
  push:
    branches: [main]
    paths:
      - release-intents/wy2-pages-approved-sha.txt
permissions:
  contents: read
concurrency:
  group: wy2-pilot-pages-production
  cancel-in-progress: false

jobs:
  validate-request:
    name: Verify explicit SHA against protected release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_sha: ${{ steps.verify.outputs.approved_sha }}
    steps:
      - name: Read protected release intent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit
        with:
          persist-credentials: false
      - name: Reject unapproved or moved reference
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          file="release-intents/wy2-pages-approved-sha.txt"
          test -f "$file" || { echo 'No protected release intent'; exit 2; }
          sha="$(tr -d '\r\n' < "$file")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid SHA'; exit 3; }
          tip="$(git ls-remote origin refs/heads/release/pilot-initial | awk '{print $1}')"
          [[ "$sha" == "$tip" ]] || { echo 'Protected release branch moved or intent mismatched'; exit 4; }
          git fetch --no-tags --depth=1 origin "$sha"
          git cat-file -e "$sha:index.html"
          git cat-file -e "$sha:404.html"
          printf 'approved_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'PRECHECK-PASS for exact protected branch SHA %s\n' "$sha"

  publish:
    name: Publish allowlisted files only after Owner approval
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: wy2-production-gate
      url: https://wy2-gh-cf-pilot-01.pages.dev
    permissions:
      contents: read
    steps:
      - name: Checkout exactly the verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit
        with:
          ref: ${{ needs.validate-request.outputs.approved_sha }}
          persist-credentials: false
      - name: Recheck SHA and branch then package static assets
        shell: bash
        env:
          APPROVED_SHA: ${{ needs.validate-request.outputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]] || { echo 'Checkout SHA mismatch'; exit 5; }
          tip="$(git ls-remote origin refs/heads/release/pilot-initial | awk '{print $1}')"
          [[ "$tip" == "$APPROVED_SHA" ]] || { echo 'Release branch changed after approval'; exit 6; }
          test -f index.html && test -f 404.html
          mkdir -p dist
          install -m 0644 index.html 404.html dist/
          if [ -f preview-probe-01.html ]; then
            install -m 0644 preview-probe-01.html dist/
          fi
          test "$(find dist -type f | wc -l)" -ge 2
          printf 'PACKAGE-PASS: exact SHA, allowlisted static files only\n'
      - name: Publish to fixed existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # verified v4 commit
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wy2-gh-cf-pilot-01 --branch=release/pilot-initial --commit-hash=${{ needs.validate-request.outputs.approved_sha }}
